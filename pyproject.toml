[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-llm-feedback"
version = "0.1.0"
description = "A reusable multi-LLM feedback workflow CLI for evaluating ideas across Claude, Gemini, and GPT."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Multi-LLM Feedback" }]
dependencies = [
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
multi-llm-feedback = "multi_llm_feedback.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multi_llm_feedback = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
